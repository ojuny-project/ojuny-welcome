[package]
name = "ojuny-welcome"
version = "0.1.0"
edition = "2021"
description = "First-boot welcome menu for Ojuny"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix-settings-gui = { path = "../nix-settings-gui", default-features = false }

[[bin]]
name = "ojuny-welcome"
path = "src/main.rs"
